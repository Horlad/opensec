name: Question
description: Ask about OpenSec behavior or development
title: "[QUESTION]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to understand?
      placeholder: Describe the question and the context in which it came up.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant commands, documentation, or troubleshooting already attempted.
    validations:
      required: false
